<VirtualHost *:80>
  DocumentRoot ${PROJECT_PATH}/${PROJECT_PUBLIC_DIR}
  DirectoryIndex index.php index.html

  <Directory ${PROJECT_PATH}/>
    Options -Indexes +FollowSymLinks +MultiViews
    AllowOverride All
    Require all granted
  </Directory>

  CustomLog /proc/self/fd/1 combined
  ErrorLog /proc/self/fd/2
</VirtualHost>
