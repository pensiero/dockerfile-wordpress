ServerName localhost

# Say "Apache" and nothing about versions or the OS.
ServerTokens Prod
ServerSignature Off
TraceEnable Off

# Scanners probe for these all day (gamempire's log, 2026-10-22). Answer 404
# without starting PHP, so they cost nothing.
RedirectMatch 404 "/\.(git|svn|hg|env)(/|$)"
<FilesMatch "\.(sql|bak|old|orig|save|swp)$|^wp-config\.php\.|~$">
  Require all denied
</FilesMatch>
