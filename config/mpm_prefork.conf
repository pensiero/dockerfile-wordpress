# Sized by APACHE_MAX_REQUEST_WORKERS (see the Dockerfile): workers x ~100 MB
# must fit the container's memory limit, or a traffic burst forks workers until
# the kernel kills the container. Children are recycled after 1000 requests so
# a slow leak in a plugin cannot grow a worker forever.
<IfModule mpm_prefork_module>
	StartServers             2
	MinSpareServers          2
	MaxSpareServers          5
	MaxRequestWorkers        ${APACHE_MAX_REQUEST_WORKERS}
	MaxConnectionsPerChild   1000
</IfModule>
