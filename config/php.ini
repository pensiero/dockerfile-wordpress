; Settings on top of php.ini-production. The first block is what the sites
; already ran with on pensiero/wordpress:php7.4; the second is hardening from
; the PHP security advisory of 2026-10-21 (CVE-2026-109618/109619).

; --- carried over
; Old themes still open PHP with "<?" instead of "<?php".
short_open_tag = On
memory_limit = ${PHP_MEMORY_LIMIT}
max_execution_time = 30
max_input_vars = 3000
max_file_uploads = 10
display_errors = Off
display_startup_errors = Off
log_errors = On
; E_STRICT is deprecated in PHP 8.4, so it is no longer named here.
error_reporting = E_ALL & ~E_DEPRECATED

; --- hardening
; upload_max_filesize stays below post_max_size, as the advisory asks.
post_max_size = ${PHP_POST_MAX_SIZE}
upload_max_filesize = ${PHP_UPLOAD_MAX_FILESIZE}
; A confirmed path to CVE-2026-109619, and no site shows upload progress.
session.upload_progress.enabled = 0
expose_php = Off

; --- opcache: the large sites have 200k+ files; revalidate every 2 s so
; updates made from wp-admin show up without a restart.
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.revalidate_freq = 2
